[package]
name = "trans"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
console = "0.16.2"
csv = "1.4.0"
dialoguer = { version = "0.12.0", features = ["completion", "fuzzy-select"] }
dotenvy = "0.15.7"
formatjs_icu_messageformat_parser = "0.2.2"
iso3166 = "1.2.1"
isolang = { version = "2.4.0", features = ["english_names"] }
calamine = "0.26.1"
codes-iso-15924 = "0.1.3"
indicatif = "0.17.8"
reqwest = { version = "0.12.14", features = ["json", "rustls-tls"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
rust_xlsxwriter = "0.92.3"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.3"
tempfile = "3.24.0"
