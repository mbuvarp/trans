name: Update Homebrew tap and bottle

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-tap:
    runs-on: macos-latest
    steps:
      - name: Set release metadata
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          if [[ -z "$tag" ]]; then
            echo "Release tag is empty." >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Compute tarball sha256
        run: |
          set -euo pipefail
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          echo "URL=$url" >> "$GITHUB_ENV"
          sha="$(curl -fL --retry 3 --retry-delay 2 "$url" | shasum -a 256 | awk '{print $1}')"
          if [[ ! "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Computed SHA is invalid: $sha" >&2
            exit 1
          fi
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: mbuvarp/homebrew-trans
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-trans

      - name: Update formula url and sha
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          tag = os.environ["TAG"]
          sha = os.environ["SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          path = pathlib.Path("homebrew-trans/Formula/trans.rb")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r'^  url ".*"$',
              f'  url "https://github.com/{repo}/archive/refs/tags/{tag}.tar.gz"',
              text,
              flags=re.M,
          )
          text = re.sub(
              r'^  sha256 ".*"$',
              f'  sha256 "{sha}"',
              text,
              flags=re.M,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Update Homebrew
        run: brew update

      - name: Ensure clean trans install
        run: |
          if brew list --formula trans >/dev/null 2>&1; then
            brew uninstall --ignore-dependencies trans
          fi

      - name: Build bottle
        run: |
          set -euo pipefail
          brew install --build-bottle ./homebrew-trans/Formula/trans.rb
          brew bottle --json --root-url "https://github.com/${{ github.repository }}/releases/download/${TAG}" trans
          bottle_json="$(ls -1 *.json | head -n 1)"
          bottle_tgz="$(ls -1 *.tar.gz | head -n 1)"
          if [[ -z "$bottle_json" || -z "$bottle_tgz" ]]; then
            echo "Bottle artifacts not found." >&2
            ls -la
            exit 1
          fi
          echo "BOTTLE_JSON=$bottle_json" >> "$GITHUB_ENV"
          echo "BOTTLE_TGZ=$bottle_tgz" >> "$GITHUB_ENV"

      - name: Upload bottle to release
        run: gh release upload "$TAG" "$BOTTLE_TGZ" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update formula bottle block
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          bottle_json = pathlib.Path(os.environ["BOTTLE_JSON"])
          data = json.loads(bottle_json.read_text(encoding="utf-8"))
          formula = data.get("formula", {}).get("trans", {})
          bottle = formula.get("bottle", {})
          files = bottle.get("files", {})
          if not files:
            raise SystemExit("Bottle JSON missing files")
          platform, info = next(iter(files.items()))
          sha = info.get("sha256")
          if not sha:
            raise SystemExit("Bottle JSON missing sha256")

          root_url = f"https://github.com/{repo}/releases/download/{tag}"
          bottle_block = (
              "  bottle do\n"
              f"    root_url \"{root_url}\"\n"
              f"    sha256 {platform}: \"{sha}\"\n"
              "  end\n"
          )

          path = pathlib.Path("homebrew-trans/Formula/trans.rb")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r"^  bottle do\\n(?:.*\\n)*?  end\\n", "", text, flags=re.M)
          lines = text.splitlines()
          out = []
          inserted = False
          for line in lines:
            out.append(line)
            if line.strip().startswith("sha256 "):
              out.append(bottle_block.rstrip("\\n"))
              inserted = True
          if not inserted:
            out.append(bottle_block.rstrip("\\n"))
          path.write_text("\\n".join(out) + "\\n", encoding="utf-8")
          PY

      - name: Create PR in Homebrew tap
        uses: peter-evans/create-pull-request@v6
        with:
          path: homebrew-trans
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          branch: update-trans-${{ env.TAG }}
          base: main
          commit-message: "chore: update trans formula for ${{ env.TAG }}"
          title: "chore: update trans formula for ${{ env.TAG }}"
          body: |
            ## Summary
            - update Homebrew formula to ${{ env.TAG }}
            - refresh tarball sha256
            - add bottle metadata

            ## Testing
            - not run (formula update only)
